<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skyscraper Prototype</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      #crosshair {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none; z-index: 10;
        color: rgba(255,255,255,0.6); font-family: monospace; font-size: 24px;
        user-select: none;
      }
      #hud {
        position: fixed; bottom: 20px; left: 20px;
        color: rgba(255,255,255,0.7); font-family: monospace; font-size: 13px;
        pointer-events: none; z-index: 10; line-height: 1.6;
        user-select: none;
      }
      #blocker {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.55); z-index: 20;
      }
      #instructions {
        text-align: center; color: #fff; font-family: monospace;
        padding: 32px 48px; border-radius: 8px; background: rgba(0,0,0,0.6);
      }
      #instructions h1 { margin-bottom: 16px; font-size: 22px; letter-spacing: 1px; }
      #instructions p { margin-top: 8px; font-size: 14px; color: #aaa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="crosshair">+</div>
    <div id="hud"></div>
    <div id="blocker">
      <div id="instructions">
        <h1>SKYSCRAPER PROTOTYPE</h1>
        <p>Click anywhere to lock pointer &amp; begin</p>
        <p>WASD — move &nbsp;|&nbsp; Mouse — look &nbsp;|&nbsp; ESC — unlock</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
